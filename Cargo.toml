[package]
name = "flexcontext"
version = "0.0.1"
edition = "2024"
default-run = "flexcontext"
description = "Fast structural lexical context retrieval for coding agents"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
ignore = "0.4"
rayon = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tree-sitter = "0.25"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"

[dev-dependencies]
criterion = "0.7"
tempfile = "3.20"

[[bench]]
name = "pipeline"
harness = false

[[bin]]
name = "flexcontext-bench"
path = "src/bin/flexcontext-bench.rs"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
